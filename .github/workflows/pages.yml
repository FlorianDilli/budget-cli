name: Build, test, and deploy web app

on:
  push:
    branches: [main, budget-web, budget-web-fresh]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          GITHUB_ACTIONS: "true"
      - name: Secret scan (built output must not contain sample figures)
        run: |
          if grep -rq "MAINGAU\|3400\.00" dist; then
            echo "Forbidden figures found in dist/"; exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/budget-web' || github.ref == 'refs/heads/budget-web-fresh'
        with:
          path: web/dist

  deploy:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/budget-web' || github.ref == 'refs/heads/budget-web-fresh'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
