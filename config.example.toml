# ╭───────────────────────────────────────────────────────────────────────────╮
# │ Welcome to your budget configuration!                                     │
# │ This file is the heart of your budget tracker.                            │
# │ Fill it out with your financial details to get started.                   │
# ╰───────────────────────────────────────────────────────────────────────────╯

# SECURITY WARNING:
# This file is NOT encrypted. Storing sensitive financial data or personally
# identifiable information in this file is a security risk.
# Ensure this file is stored in a secure, access-controlled location.


# ╭───────────────────────────────────────────────────────────────────────────╮
# │ [user]                                                                    │
# │ Basic user-specific settings.                                             │
# ╰───────────────────────────────────────────────────────────────────────────╯
[user]
currency_symbol = "EUR"      # Your currency symbol (e.g., "$", "£", "¥")


# ╭───────────────────────────────────────────────────────────────────────────╮
# │ [importer]                                                                │
# │ Maps your bank's CSV column names to what the app expects.                │
# │ Make sure these match the headers in your CSV statement exactly.          │
# ╰───────────────────────────────────────────────────────────────────────────╯
[importer]
date_column        = "Value Date"
description_column = "Partner Name"
amount_column      = "Amount (EUR)"


# ╭───────────────────────────────────────────────────────────────────────────╮
# │ [theme]                                                                   │
# │ Personalize the look of the app.                                          │
# │ Use hex codes for colors (e.g., "#FF5733").                               │
# ╰───────────────────────────────────────────────────────────────────────────╯
[theme]
accent_color                    = "#FFCF71"  # Color for titles and highlights
main_color                      = "#FBF6E2"  # General text color
positive                        = "#A1C398"  # Color for positive amounts (income)
negative                        = "#FA7070"  # Color for negative amounts (expenses)
recurring_transaction_highlight = "#E2B59A"  # Color for recurring transactions in lists


# ╭───────────────────────────────────────────────────────────────────────────╮
# │ [category_rules]                                                          │
# │ Define keywords to automatically categorize your transactions.            │
# │ The app scans the transaction's description for the keywords you define.  │
# │ The matching is case-insensitive and works if the keyword is part of the  │
# │ description. For example, a keyword "supermarket" will match              │
# │ "Local Supermarket" and "SUPERMARKET INC.".                               │
# │ Format: "CategoryName" = ["keyword1", "keyword2", ...]                    │
# ╰───────────────────────────────────────────────────────────────────────────╯
[category_rules]
# --- Example Category Rules ---
# "Groceries"   = ["supermarket", "grocery", "lidl", "aldi"]
# "Rent"        = ["rent"]
# "Utilities"   = ["electricity", "water", "gas", "internet"]
# "Transport"   = ["uber", "lyft", "taxi", "public transport"]
# "Dining Out"  = ["restaurant", "cafe", "food delivery"]
# "Subscriptions" = ["netflix", "spotify", "hbo"]


# ╭───────────────────────────────────────────────────────────────────────────╮
# │ [recurring_transactions]                                                  │
# │ This is the most important section for calculating your budget.           │
# │ List all your predictable income and expenses here. The app uses this to  │
# │ calculate your "normalized monthly budget."                               │
# │                                                                           │
# │ - `description`: A keyword used to identify transactions. A transaction   │
# │   is marked as recurring if this keyword is found anywhere in its         │
# │   description (case-insensitive). For example, "Spotify" will match       │
# │   "PAYPAL *SPOTIFY*P3C321".                                               │
# │ - `amount`: Use positive for income, negative for expenses.               │
# │ - `recurrence_months`: How often it occurs (1=monthly, 3=quarterly, etc.) │
# │ - `start_date`: The date the recurring transaction begins (YYYY-MM-DD).   │
# │   This is optional. If omitted, it's active from the beginning.           │
# │ - `end_date`: The date the recurring transaction can end (YYYY-MM-DD).    │
# │   Also optional. If omitted, it remains active indefinitely.              │
# │                                                                           │
# │ NOTE: The monthly budget, for both the dashboard and history views, is      │
# │       calculated based on which recurring transactions are active on the    │
# │       first day of the respective month.                                    │
# ╰───────────────────────────────────────────────────────────────────────────╯

# --- Example Income ---
# [[recurring_transactions]]
# description       = "Monthly Salary"
# amount            = 3000.00
# recurrence_months = 1

# --- Example Yearly Expense ---
# The app automatically spreads this cost across the year in your budget.
# e.g., -240 / 12 months = -20 per month.
# [[recurring_transactions]]
# description       = "Car Insurance"
# amount            = -240.00
# recurrence_months = 12
# start_date        = "2023-01-01"
# end_date          = "2023-12-31"
